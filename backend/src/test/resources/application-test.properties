# Test profile: allow context smoke tests without a live PostgreSQL instance.
# Production / default settings in application.properties are unchanged.
#
# DataSource and JPA auto-configuration are excluded here only so Maven verify
# can succeed before local database credentials are available.

spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

app.jwt.secret=test-only-secret-that-is-at-least-32-characters-long
app.jwt.expiration-ms=3600000
app.jwt.cookie-name=CPMS_AUTH_TEST
app.cors.allowed-origin=http://localhost:3000

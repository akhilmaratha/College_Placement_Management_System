# Isolated @DataJpaTest profile — in-memory H2 only.
# Does NOT prove PostgreSQL CHECK/trigger/index compatibility. Apply database/schema.sql for that.

spring.datasource.url=jdbc:h2:mem:cpms_persistence;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# Avoid Hibernate-generated enum CHECKs that use Java constant names instead of DB VARCHAR values.
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false


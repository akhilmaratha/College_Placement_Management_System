spring.application.name=placement

server.port=${SERVER_PORT:8080}

# PostgreSQL — credentials and host details come from environment variables only.
# Defaults below are local-development placeholders (see .env.example). Never commit real secrets.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:placement_db}
spring.datasource.username=${DB_USERNAME:placement_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema owned by database/schema.sql (DB developer). No Flyway until team agreement.
# validate: fail startup if entity mappings diverge from an applied PostgreSQL schema.
# Dialect is auto-detected from a live JDBC connection.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never


# Optional local overrides: set SPRING_PROFILES_ACTIVE=local (see application-local.properties).

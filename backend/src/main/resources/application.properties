spring.application.name=placement

server.port=${SERVER_PORT:8080}

# PostgreSQL credentials come from environment variables only. Prefer the
# standard Spring names for hosted providers such as Neon; retain the DB_*
# variables as a local-development fallback. Never commit real secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:placement_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:placement_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_me}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema owned by database/schema.sql (DB developer). No Flyway until team agreement.
# validate: fail startup if entity mappings diverge from an applied PostgreSQL schema.
# Dialect is auto-detected from a live JDBC connection.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Authentication. Set JWT_SECRET to a long random value in every non-test environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.cookie-name=${JWT_COOKIE_NAME:CPMS_AUTH}
app.jwt.secure-cookie=${JWT_SECURE_COOKIE:false}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}


# Optional local overrides: set SPRING_PROFILES_ACTIVE=local (see application-local.properties).
